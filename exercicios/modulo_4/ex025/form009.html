<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Mais output</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="Inumero">Numero:</label>
            <input type="range" name="numero" id="Inumero" min="0" max="10" value="5" oninput="resultado.innerHTML=Number(Inumero.value)">
            <output id="resultado">5</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
