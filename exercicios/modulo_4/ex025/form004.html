<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulario 4</title>
</head>
<body>
    <h1>Exemplo de formulario com telefone e email</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="tel" name="nome" id="inome" min="5" maxlength="20" required>
            </p>
            <p>
                <label for="Iemail">Email:</label>
                <input type="email" name="email" id="Iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="Icelular">Celular:</label>
                <input type="tel" name="celular" id="Icelular" autocomplete="tel" pattern="^\(\d{2}\) \d{4,5}-\d{4}$" placeholder="(xx) xxxx-xxxx" required >
            </p>
            <p>
                <input type="submit" value="Cadastrar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
