<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="Icor">Cor:</label>
            <input type="color" name="cor" id="Icor" value="cadetblue">
        </p>

        <p>
            <label for="Isatis">Nivel de Satisfação:</label>
            <input type="range" name="satis" id="Isatis" min="0" max="10" step="0.5" value="8.5">
        </p>
        <p>
            <label for="Ifoto">Foto do Perfil:</label>
            <input type="file" name="foto" id="Ifoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
