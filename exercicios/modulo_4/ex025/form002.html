<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios 2</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="Iusuario">Usuario:</label>
            <input type="text" name="usuario" id="Iusuario" required minlength="6" maxlength="12" size="10" placeholder="username" autocomplete="username">
        </p>
        <p>
            <label for="Isenha">Senha:</label>
            <input type="password" name="senha" id="Isenha" required minlength="8" maxlength="20" size="8" placeholder="password" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
