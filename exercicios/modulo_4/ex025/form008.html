<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Outputs nos formularios (JS)</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="Inumero1">Numero 1:</label>
            <input type="number" name="numero1" id="Inumero1" min="0" max="50" required oninput="Isoma.innerHTML=Number(Inumero1.value) + Number(Inumero2.value)">
        </p>
        <p>
            <label for="Inumero2">Numero 2:</label>
            <input type="number" name="numero2" id="Inumero2" min="0" max="50" required oninput="Isoma.innerHTML=Number(Inumero1.value) + Number(Inumero2.value)">
        </p>

        <p>
            <label for="Isoma">Soma:</label>
            <output id="Isoma" name="soma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
