<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container-pai{
            background-color: lightsalmon;
            display:flex;
            flex-flow: column wrap-reverse;
        }

        .item-filho{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            align-content: center;

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container-pai">
        <div class="item-filho"> Exemplo de bloco A</div>
        <div class="item-filho"> Exemplo de bloco B</div>
        <div class="item-filho"> Exemplo de bloco C</div>
        <div class="item-filho"> Exemplo de bloco D</div>
        <div class="item-filho"> Exemplo de bloco E</div>
        <div class="item-filho"> Exemplo de bloco F</div>
        <div class="item-filho"> Exemplo de bloco G</div>
        <div class="item-filho"> Exemplo de bloco H</div>
    </div>
</body>
</html>
