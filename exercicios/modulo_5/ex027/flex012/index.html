<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container-pai{
            background-color: lightsalmon;
            display:flex;
            flex-flow: row nowrap;
        }

        .item-filho{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;            
        }

        #cxA{
            /*flex-grow: 3;
            flex-shrink: 1;
            flex-basis: 200px;*/

            flex: 3 1 200px;
        }

        #cxB{
            /*flex-grow:1;
            flex-shrink: 0;
            flex-basis:100px*/

            flex: 1 0 100px;
        }

        #cxC{
            /*flex-grow: 0;
            flex-shrink: 1;
            flex-basis: auto;*/

            flex: 0 1 auto;
        }
    </style>
</head>
<body>
    <div class="container-pai">
        <div class="item-filho" id="cxA">A</div>
        <div class="item-filho" id="cxB" >B</div>
        <div class="item-filho" id="cxC">C</div>
    </div>
</body>
</html>
