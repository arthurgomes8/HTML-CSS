<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container-pai{
            background-color: lightsalmon;
            display:flex;
            flex-flow: row nowrap;
        }

        .item-filho{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;

            flex-shrink: 1;
            flex-grow: 1;
            
        }

        #especial{
            flex-grow: 2;
        }
        #retardatario{
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div class="container-pai">
        <div class="item-filho" id="especial">A</div>
        <div class="item-filho" >B</div>
        <div class="item-filho" id="retardatario">C</div>
    </div>
</body>
</html>
