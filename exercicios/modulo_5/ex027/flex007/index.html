<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container-pai{
            background-color: lightsalmon;
            display:flex;
            flex-flow: row wrap;
        }

        .item-filho{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;

        }

        #n1{
            order: 0;
        }
        #n2{
            order: -2;
        }
        #n3{
            order: 4;
        }
        #n4{
            order: 8;
        }
        #n5{
            order: 2;
        }
        #n6{
            order: 0;
        }
        #n7{
            order: 2;
        }
        #n8{
            display: none;
        }
    </style>
</head>
<body>
    <div class="container-pai">
        <div class="item-filho" id="n1">A</div>
        <div class="item-filho" id="n2">B</div>
        <div class="item-filho" id="n3">C</div>
        <div class="item-filho" id="n4">D</div>
        <div class="item-filho" id="n5">E</div>
        <div class="item-filho" id="n6">F</div>
        <div class="item-filho" id="n7">G</div>
        <div class="item-filho" id="n8">H</div>
    </div>
</body>
</html>
